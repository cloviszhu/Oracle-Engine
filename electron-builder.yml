appId: com.serenity.family
productName: Serenity
directories:
  output: release
files:
  - out/**
extraResources:
  - from: dist
    to: dist
  - from: drizzle/migrations
    to: drizzle/migrations
  - from: docker-compose.yml
    to: docker-compose.yml
win:
  target:
    - target: portable
      arch: [x64]
  artifactName: Serenity-${version}-${arch}.${ext}
asar: true
